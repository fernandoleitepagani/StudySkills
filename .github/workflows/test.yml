name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: node --test

      - name: Check JavaScript syntax
        run: |
          find skills scripts test test-support -name '*.mjs' -print0 \
            | xargs -0 -n1 node --check
