name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check version sync
        run: npm run check:version

      - name: Check generated skill core
        run: npm run check:skills

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Check marketplace manifests
        run: npm run check:marketplaces

      - name: Check skill install layout
        run: npm run check:install

      - name: Run tests
        run: node --test
